# backend/src/main/resources/application.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/gradiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

app:
  gemini:
    # No default on purpose? No — a default keeps the app bootable during
    # development/tests without a key. Steps fail at runtime with a clear error
    # only when Gemini is actually called.
    api-key: ${GEMINI_API_KEY:}
    text-model: ${GEMINI_TEXT_MODEL:gemini-3.6-flash}
    image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:fallback-secret-for-dev}
    expiration: 86400000

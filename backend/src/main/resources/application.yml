# backend/src/main/resources/application.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/gradiondb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

app:
  gemini:
    api-key: ${GEMINI_API_KEY}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:fallback-secret-for-dev}
    expiration: 86400000